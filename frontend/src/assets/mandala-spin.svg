<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <style>
      .mandala-group {
        transform-origin: center;
      }
      .path-stroke {
        fill: none;
        stroke: rgba(255, 255, 255, 0.2); 
        stroke-width: 1;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .path-fill {
        fill: rgba(255, 255, 255, 0.05);
        stroke: none;
      }
      .dot {
        fill: rgba(255, 255, 255, 0.3);
        stroke: none;
      }
    </style>
  </defs>
  
  <g class="mandala-group">
    <!-- Smooth Infinite Rotation: 90s for gentle spa feel -->
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      from="0 200 200" 
      to="360 200 200" 
      dur="120s" 
      repeatCount="indefinite" />

    <!-- Layer 1: Central Star -->
    <path class="path-stroke" d="M200 150 Q220 180 200 200 Q180 180 200 150" />
    <path class="path-stroke" d="M200 150 Q220 180 200 200 Q180 180 200 150" transform="rotate(45 200 200)"/>
    <path class="path-stroke" d="M200 150 Q220 180 200 200 Q180 180 200 150" transform="rotate(90 200 200)"/>
    <path class="path-stroke" d="M200 150 Q220 180 200 200 Q180 180 200 150" transform="rotate(135 200 200)"/>
    <path class="path-stroke" d="M200 150 Q220 180 200 200 Q180 180 200 150" transform="rotate(180 200 200)"/>
    <path class="path-stroke" d="M200 150 Q220 180 200 200 Q180 180 200 150" transform="rotate(225 200 200)"/>
    <path class="path-stroke" d="M200 150 Q220 180 200 200 Q180 180 200 150" transform="rotate(270 200 200)"/>
    <path class="path-stroke" d="M200 150 Q220 180 200 200 Q180 180 200 150" transform="rotate(315 200 200)"/>

    <!-- Layer 2: Inner Circles -->
    <circle cx="200" cy="200" r="20" class="path-stroke" />
    <circle cx="200" cy="200" r="10" class="path-fill" />
    
    <!-- Layer 3: Main Petals Layout -->
    <circle cx="200" cy="200" r="60" class="path-stroke" stroke-dasharray="2 4" />
    <circle cx="200" cy="200" r="80" class="path-stroke" />

    <!-- Elaborate Outer Petals -->
    <path class="path-stroke" d="M200 100 C 230 140, 240 160, 200 200 C 160 160, 170 140, 200 100" />
    <path class="path-stroke" d="M200 100 C 230 140, 240 160, 200 200 C 160 160, 170 140, 200 100" transform="rotate(45 200 200)"/>
    <path class="path-stroke" d="M200 100 C 230 140, 240 160, 200 200 C 160 160, 170 140, 200 100" transform="rotate(90 200 200)"/>
    <path class="path-stroke" d="M200 100 C 230 140, 240 160, 200 200 C 160 160, 170 140, 200 100" transform="rotate(135 200 200)"/>
    <path class="path-stroke" d="M200 100 C 230 140, 240 160, 200 200 C 160 160, 170 140, 200 100" transform="rotate(180 200 200)"/>
    <path class="path-stroke" d="M200 100 C 230 140, 240 160, 200 200 C 160 160, 170 140, 200 100" transform="rotate(225 200 200)"/>
    <path class="path-stroke" d="M200 100 C 230 140, 240 160, 200 200 C 160 160, 170 140, 200 100" transform="rotate(270 200 200)"/>
    <path class="path-stroke" d="M200 100 C 230 140, 240 160, 200 200 C 160 160, 170 140, 200 100" transform="rotate(315 200 200)"/>
    
    <!-- Outer Rim Details -->
    <path class="path-stroke" d="M200 40 L210 60 L200 80 L190 60 Z" transform="rotate(22.5 200 200)" />
    <path class="path-stroke" d="M200 40 L210 60 L200 80 L190 60 Z" transform="rotate(67.5 200 200)" />
    <path class="path-stroke" d="M200 40 L210 60 L200 80 L190 60 Z" transform="rotate(112.5 200 200)" />
    <path class="path-stroke" d="M200 40 L210 60 L200 80 L190 60 Z" transform="rotate(157.5 200 200)" />
    <path class="path-stroke" d="M200 40 L210 60 L200 80 L190 60 Z" transform="rotate(202.5 200 200)" />
    <path class="path-stroke" d="M200 40 L210 60 L200 80 L190 60 Z" transform="rotate(247.5 200 200)" />
    <path class="path-stroke" d="M200 40 L210 60 L200 80 L190 60 Z" transform="rotate(292.5 200 200)" />
    <path class="path-stroke" d="M200 35 L210 55 L200 75 L190 55 Z" transform="rotate(337.5 200 200)" />

    <!-- Ornate Dots -->
    <circle cx="200" cy="30" r="4" class="dot" />
    <circle cx="200" cy="30" r="4" class="dot" transform="rotate(45 200 200)"/>
    <circle cx="200" cy="30" r="4" class="dot" transform="rotate(90 200 200)"/>
    <circle cx="200" cy="30" r="4" class="dot" transform="rotate(135 200 200)"/>
    <circle cx="200" cy="30" r="4" class="dot" transform="rotate(180 200 200)"/>
    <circle cx="200" cy="30" r="4" class="dot" transform="rotate(225 200 200)"/>
    <circle cx="200" cy="30" r="4" class="dot" transform="rotate(270 200 200)"/>
    <circle cx="200" cy="30" r="4" class="dot" transform="rotate(315 200 200)"/>
    
    <!-- Outer Binding Rings -->
    <circle cx="200" cy="200" r="140" class="path-stroke" stroke-width="0.5" />
    <circle cx="200" cy="200" r="150" class="path-stroke" stroke-dasharray="1 8" stroke-width="3" />
    <circle cx="200" cy="200" r="180" class="path-stroke" stroke-opacity="0.1" />

  </g>
</svg>
