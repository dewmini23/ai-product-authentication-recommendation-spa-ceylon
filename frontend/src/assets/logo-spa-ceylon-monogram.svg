<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Complex Mandala / Lotus Pattern -->
  <g fill="none" stroke="#C9A646" stroke-width="1.5">
    <circle cx="100" cy="100" r="40" opacity="0.3"/>
    <circle cx="100" cy="100" r="60" opacity="0.2"/>
    <circle cx="100" cy="100" r="80" opacity="0.1"/>
    
    <!-- Petals -->
    <path d="M100,20 Q130,60 100,100 Q70,60 100,20" />
    <path d="M100,180 Q130,140 100,100 Q70,140 100,180" />
    <path d="M180,100 Q140,130 100,100 Q140,70 180,100" />
    <path d="M20,100 Q60,130 100,100 Q60,70 20,100" />
    
    <!-- Diagonal Petals -->
    <path d="M156,44 Q140,80 100,100 Q120,60 156,44" transform="rotate(0 100 100)" />
    <path d="M156,156 Q120,140 100,100 Q140,120 156,156" />
    <path d="M44,156 Q60,120 100,100 Q80,140 44,156" />
    <path d="M44,44 Q80,60 100,100 Q60,80 44,44" />
  </g>
</svg>
