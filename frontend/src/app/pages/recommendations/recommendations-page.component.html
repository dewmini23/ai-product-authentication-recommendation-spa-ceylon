<div class="page-container">
    <div class="page-header">
        <button class="back-btn" (click)="goHome()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Back to Home</span>
        </button>
    </div>

    <div class="recommendations-layout">
        <div class="chat-column">
            <app-chat-panel [messages]="messages" [isTyping]="isTyping" (sendMessage)="onSendMessage($event)">
            </app-chat-panel>
        </div>
        <div class="products-column">
            <app-products-grid [products]="recommendations" (quickView)="onQuickView($event)"
                (addToCart)="onAddToCart($event)">
            </app-products-grid>
        </div>

        <app-quick-view-modal *ngIf="isQuickViewOpen" [product]="selectedProduct" (closeEvent)="closeQuickView()"
            (addToCart)="onAddToCart($event)">
        </app-quick-view-modal>
    </div>
</div>
