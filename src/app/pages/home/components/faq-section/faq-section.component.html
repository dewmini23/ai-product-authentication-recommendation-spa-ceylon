<section class="faq-section">
    <div class="page-container">
        <div class="section-header">
            <h2>FAQs</h2>
        </div>

        <div class="faq-list">
            <div class="faq-item" *ngFor="let faq of faqs; let i = index" [class.open]="faq.isOpen">
                <button class="faq-question" (click)="toggle(i)" [attr.aria-expanded]="faq.isOpen" type="button">
                    <span class="icon-wrapper">
                        <!-- Minimal Line Icon (Question Circle) -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                    </span>
                    <span class="question-text">{{ faq.question }}</span>
                    <span class="chevron" [class.rotated]="faq.isOpen">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </span>
                </button>
                <div class="faq-answer-wrapper" [style.max-height]="faq.isOpen ? '200px' : '0'">
                    <div class="faq-answer">
                        <p>{{ faq.answer }}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
